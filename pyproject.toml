[project]
name = "oficina-agentes-academicos"
version = "0.1.0"
description = "Orquestación de agentes IA para producir investigación académica"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.8",
    "pyyaml>=6.0",
]

[project.scripts]
oficina = "oficina.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["oficina*"]

[tool.setuptools.package-data]
oficina = ["prompts/*.md"]
